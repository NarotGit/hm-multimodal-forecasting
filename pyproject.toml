[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hm-forecast"
version = "0.1.0"
description = "Multimodal probabilistic forecasting of H&M article-level purchase activity (dissertation project)."
readme = "README.md"
requires-python = ">=3.12,<3.14"

# Core data stack only. PyTorch, sentence-transformers, MLflow, Streamlit and
# Plotly are added in the stage that first needs them (see docs/DECISIONS.md, D-002).
dependencies = [
    "numpy>=2.5,<3",
    "polars>=2.1,<3",
    "pyarrow>=26,<27",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "psutil>=7,<8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
