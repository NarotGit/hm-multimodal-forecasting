# Expected source files for the H&M dataset.
#
# Everything here is EXPECTED (taken from the Kaggle data description), not yet
# verified against the actual files. The inventory step compares the real files
# with this specification and reports differences; it does not silently fix them.
#
# Currently enforced by src/hm_forecast/data/inventory.py:
#   file exists, is non-empty, header is readable, required columns present,
#   unexpected columns reported, rough file size plausible.
# NOT yet enforced (later steps): dtypes, row counts, value ranges, keys.
# The dtype strings below document intent and will be used by the profiling step.

schema_version: 1

dataset:
  name: "H&M Personalized Fashion Recommendations"
  source: "https://www.kaggle.com/competitions/h-and-m-personalized-fashion-recommendations"
  terms: "Kaggle competition rules apply. Raw files are never committed to Git."

# A file whose size is outside [expected / ratio, expected * ratio] gets a WARNING.
# This only catches gross problems (for example a truncated or wrong file).
size_tolerance_ratio: 2.0

files:
  transactions_train.csv:
    required: true
    approx_size_mb: 3500
    columns:
      t_dat: "date string (YYYY-MM-DD)"
      customer_id: "string (hashed)"
      article_id: "integer"
      price: "float"
      sales_channel_id: "integer (1 or 2)"

  articles.csv:
    required: true
    approx_size_mb: 36
    columns:
      article_id: "integer"
      product_code: "integer"
      prod_name: "string"
      product_type_no: "integer"
      product_type_name: "string"
      product_group_name: "string"
      graphical_appearance_no: "integer"
      graphical_appearance_name: "string"
      colour_group_code: "integer"
      colour_group_name: "string"
      perceived_colour_value_id: "integer"
      perceived_colour_value_name: "string"
      perceived_colour_master_id: "integer"
      perceived_colour_master_name: "string"
      department_no: "integer"
      department_name: "string"
      index_code: "string"
      index_name: "string"
      index_group_no: "integer"
      index_group_name: "string"
      section_no: "integer"
      section_name: "string"
      garment_group_no: "integer"
      garment_group_name: "string"
      detail_desc: "string (free text, may be missing)"

  # Optional: only used if exploratory analysis later justifies customer features.
  customers.csv:
    required: false
    approx_size_mb: 207
    columns:
      customer_id: "string (hashed)"
      FN: "float (flag, many missing)"
      Active: "float (flag, many missing)"
      club_member_status: "string"
      fashion_news_frequency: "string"
      age: "float (some missing)"
      postal_code: "string (hashed)"

# Settings for src/hm_forecast/data/profile_articles.py
profiling:
  articles:
    key_column: article_id          # must be unique, non-missing, integer-like
    group_column: product_code      # several article_ids (variants) may share one product_code
    text_columns: [prod_name, detail_desc]
    # [code column, name column]: each code should map to exactly one name and vice versa.
    code_name_pairs:
      - [product_type_no, product_type_name]
      - [graphical_appearance_no, graphical_appearance_name]
      - [colour_group_code, colour_group_name]
      - [perceived_colour_value_id, perceived_colour_value_name]
      - [perceived_colour_master_id, perceived_colour_master_name]
      - [department_no, department_name]
      - [index_code, index_name]
      - [index_group_no, index_group_name]
      - [section_no, section_name]
      - [garment_group_no, garment_group_name]

# Settings for src/hm_forecast/data/profile_transactions.py
  transactions:
    expected_channel_values: ["1", "2"]
    # Width of the zero-padded article_id in articles.csv (measured in the articles profile).
    article_id_width: 10
    max_missing_dates_listed: 20

# Settings for src/hm_forecast/eda/article_daily.py (Stage 3, Step 1).
# These only control how the EDA *measures*; none of them is an eligibility rule.
eda:
  article_daily:
    expected_channel_values: ["1", "2"]
    spike_window_days: 29        # centred rolling-median window = the "normal" level of a day
    top_spike_days: 15
    count_histogram_cap: 20      # article-day counts above this are pooled into one bucket
    quantiles: [0.01, 0.05, 0.10, 0.25, 0.50, 0.75, 0.90, 0.95, 0.99]
    min_threshold_values: [1, 2, 5, 10, 30, 100]   # reported only; no threshold is chosen here
    recent_windows_days: [7, 28]
